[project]
name = "cop-thief-thief"
version = "1.0.0"
description = "vm__fabi — Cop-Thief P2P thief agent (generated export; do not edit by hand)"
requires-python = ">=3.13"
dependencies = ["fastmcp>=3.4.3"]

[project.scripts]
thief-agent = "thief_agent.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cop_thief_core", "src/thief_agent"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
source = ["src"]
omit = ["*/gui/*", "src/*/__main__.py"]
