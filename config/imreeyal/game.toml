# PAIRING config: vm__fabi vs imreeyal — one peer process, role alternation.
# PARITY (imreeyal's correction, 2026-08-18): vm__fabi plays POLICE in the odd
# sub-games (1,3,5); imreeyal is THIEF on odds — and as thief THEY open
# sub-game 1 (thief takes the first turn of every sub-game).
# The signed shared constitution is game.json — byte-identical to imreeyal's
# (their first-contact message, 2026-08-17), agreed_between the sorted pair.
# Run: uv run python -m police_agent --config config/imreeyal   <-- POLICE!
# Tunnel: ngrok http 8802 --domain=cop-rob-p2p.ngrok.app --host-header=rewrite
version = "1.10"

[game]
group_name = "VM-Fabi"
group_id = "vm__fabi"                 # binding on the wire — matches our §1 reply
sub_game_number = 1
members = ["Vasily Mironovich", "Fahed Bitar"]
repos = { cop = "https://github.com/mironovich-v/cop-rob-p2p-police", thief = "https://github.com/mironovich-v/cop-rob-p2p-thief" }
mcp_servers = { cop = "https://cop-rob-p2p.ngrok.app/mcp", thief = "https://cop-rob-p2p.ngrok.app/mcp" }
opponent_group_id = "imreeyal"        # handshake refuses any other group
counted = false                       # flip ONLY for the one counted series (+ --counted)
counted_games_played = 2              # nis-yar1 2026-08-18 + vibecode 2026-08-22;
                                      # an armed run declares 3 including this series
tie_rule = "series_add"               # declared in the constitution chat (ADR-17)

[belief]
smell_trust_weight = 4.0

[paths]
logs_dir = "logs"

[play]
step_speed_seconds = 0.0              # headless: no GUI pacing between steps
seed = 1234

[network]
my_port = 8802
# ROLE-SPLIT: imreeyal run two doors. We are POLICE on odd, so THEY are thief
# on odd — dial their THIEF door in 1/3/5 and their POLICE door in 2/4/6.
# The single-URL config dialled their cop door in every sub-game, which is the
# wrong end for half the series.
opponent_url_thief = "https://thief.imreeyal.com/mcp"
opponent_url_police = "https://cop.imreeyal.com/mcp"
opponent_url = "https://thief.imreeyal.com/mcp"   # initial dial: sub-game 1, they are thief
turn_timeout_seconds = 180
poll_interval_seconds = 0.5
connect_timeout_seconds = 150   # handshake patience: spans their inter-sub-game door gap
retry_interval_seconds = 1.0
audit_send_timeout_seconds = 10
call_timeout_seconds = 10       # per-call cap: strictly < signed response_timeout_sec (30)
handshake_repush_seconds = 5.0  # re-push the greeting until the game starts
reorder_window = 1
shutdown_grace_seconds = 5.0  # outlive the drain so the opponent's final
                              # submit_audit ack is flushed, not killed

[trash_talk]
provider = "template"           # llm_model: template — zero tokens, no LLM on the wire

[llm]
model = "template"
step_deadline_seconds = 30
short_prompt_threshold_seconds = 10

[email]
# Friendly posture: auto-fire the report into IMREEYAL's inbox at settlement
# (their pre-counted gate) + our own copy. The lecturer stays structurally
# unreachable unless doubly armed (game.counted AND --counted; ADR-20).
# Counted day: recipient becomes the lecturer ALONE, set by hand before the T.
recipient = ["imreeyal.copthief@gmail.com", "imree.c@gmail.com", "mironovichvasily@gmail.com"]
lecturer_address = "rmisegal+uoh26finalgame@gmail.com"
mode = "send"
enabled = true
timeout_seconds = 120
